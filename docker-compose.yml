name: car-information-system

services:
  mongo:
    image: mongo:7
    container_name: car-data-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 20s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: car-data-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: car-data-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/car_data_db
      JWT_SECRET: super-secret-key
      JWT_EXPIRES_IN: 1d
      ADMIN_EMAIL: admin@carinfo.local
      ADMIN_PASSWORD: Admin123!
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: car-images
      MINIO_PUBLIC_URL: http://localhost:9000
      OLLAMA_BASE_URL: https://ollama.if.unismuh.ac.id
      OLLAMA_MODEL: llama3.2:latest
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: car-data-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:3000"

volumes:
  mongo_data:
  minio_data:
